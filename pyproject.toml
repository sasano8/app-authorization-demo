[project]
name = "app-authorization-demo"
version = "0.1.0"
description = "Google SSO ID token exchange and resource authorization demo"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "PyJWT[crypto]==2.15.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.uv]
package = false
