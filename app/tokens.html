<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>API 用トークンの取得</title>
<style>body{font-family:system-ui;margin:40px auto;padding:0 20px;max-width:800px;background:#f5f7fb;color:#17233b}section{background:white;padding:24px;border-radius:12px;margin:18px 0}button,input{padding:10px;margin:5px}button{cursor:pointer}textarea{width:100%;height:130px;box-sizing:border-box}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#526078}</style>
<p><a href="/">認可デモへ戻る</a></p><h1>API 用トークンの取得</h1>
<p>サンプル API を curl や外部ツールから呼び出すためのアクセストークンを取得します。</p>
<section><p id="session">セッション確認中…</p><form id="login" hidden><input name="username" aria-label="ユーザー名" value="demo" required><input name="password" aria-label="パスワード" type="password" value="demo" required><button>ログイン</button><p><small>ローカルデモ用：demo / demo</small></p></form><button id="logout">ログアウト</button></section>
<section><label for="ttl">有効期間（秒）</label><input id="ttl" type="number" min="1" step="1" value="43200" required><p id="ttlHelp"></p><button id="issue" disabled>API 用トークンを取得</button><p id="expiry">未取得</p><textarea id="token" readonly aria-label="API用アクセストークン"></textarea><button id="copy" disabled>トークンをコピー</button><button id="copyCommand" disabled>curl コマンドをコピー</button><pre id="command"></pre><small>発行ボタンを押したときだけ発行します。有効期限が切れたら再発行してください。トークンを共有しないでください。</small></section>
<section><p id="status" role="status"></p></section>
<script>
let idToken='',accessToken='',expiresAt=0,logoutUrl='',sessionVersion=0;
const el=id=>document.getElementById(id);
function command(){return 'curl '+JSON.stringify(location.origin+'/api/resource')+' \\\n  -H '+JSON.stringify('Authorization: Bearer '+accessToken);}
function render(){el('token').value=accessToken;el('issue').disabled=!idToken;el('copy').disabled=!accessToken;el('copyCommand').disabled=!accessToken;el('command').textContent=accessToken?command():'';el('expiry').textContent=expiresAt?'有効期限：'+new Date(expiresAt).toLocaleString():'未取得';}
async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const text=await r.text();let d;try{d=JSON.parse(text);}catch(e){throw Error('HTTP '+r.status+'：レスポンスを JSON として読めませんでした（'+e.message+'）。プロキシのログインページやエラーページが返っている可能性があります。先頭：'+text.slice(0,200));}if(!r.ok)throw Error(d.detail||'リクエスト失敗');return d;}
async function run(fn){try{await fn();}catch(e){el('status').textContent=e.message;}render();}
async function issue(ttl=Number(el('ttl').value)){if(!Number.isSafeInteger(ttl)||ttl<1||ttl>Number(el('ttl').max))throw Error('有効期間は1秒から上限までの整数で指定してください。');const version=sessionVersion;const d=await api('/api/token',{id_token:idToken,ttl_seconds:ttl});if(version!==sessionVersion)return;accessToken=d.access_token;expiresAt=Date.now()+d.expires_in*1000;el('status').textContent='API 用トークンを取得しました。';}
el('login').onsubmit=e=>{e.preventDefault();run(async()=>{const d=await api('/api/login',Object.fromEntries(new FormData(e.target)));idToken=d.id_token;accessToken='';expiresAt=0;el('session').textContent='ローカルでログイン済み';el('status').textContent='API 用トークンを取得できます。';});};
el('issue').onclick=()=>run(()=>issue());
el('copy').onclick=()=>run(async()=>{await navigator.clipboard.writeText(accessToken);el('status').textContent='トークンをコピーしました。';});
el('copyCommand').onclick=()=>run(async()=>{await navigator.clipboard.writeText(command());el('status').textContent='curl コマンドをコピーしました。';});
el('logout').onclick=()=>{sessionVersion++;idToken='';accessToken='';expiresAt=0;render();el('session').textContent='ログアウト済み';el('status').textContent='画面内のトークンを破棄しました。コピー済みの JWT は期限まで有効です。';if(logoutUrl)location.assign(logoutUrl);};
run(async()=>{const policy=await api('/api/token-policy');el('ttl').value=policy.default_ttl_seconds;el('ttl').max=policy.max_ttl_seconds;el('ttlHelp').textContent='既定：'+policy.default_ttl_seconds+'秒 ／ 上限：'+policy.max_ttl_seconds+'秒（12時間 = 43200秒）';const d=await api('/api/session');logoutUrl=d.logout_url;el('login').hidden=!d.local_login_allowed;if(d.authenticated){idToken=d.id_token;el('session').textContent='SSO ログイン済み：'+d.user;}else{el('session').textContent=d.local_login_allowed?'ローカルログインが利用できます':'SSO ログインが必要です（'+d.id_token_header.name+' ヘッダーは届いていません。トップ画面の説明を参照）';}});
</script></html>
